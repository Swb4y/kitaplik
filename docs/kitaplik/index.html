<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="İki kişilik ortak okuma günlüğü: hangi kitabı bitirdin, hangisini okuyorsun, sırada ne var." />
<meta name="theme-color" content="#eff1ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kitaplık" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<!-- ARTIFACT-START -->
<title>Kitaplık</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Newsreader:wght@500;600&display=swap" />
<style>
  :root {
    --bg: #eff1ec;
    --surface: #ffffff;
    --surface-2: #f7f8f4;
    --ink: #14201c;
    --muted: #5e6b64;
    --faint: #8b968f;
    --line: #d9ded6;
    --line-soft: #e6eae2;
    --accent: #17594a;
    --accent-ink: #ffffff;
    --accent-soft: #dbe8e2;
    --s-plan: #4a6fa5;
    --s-reading: #b87333;
    --s-done: #17594a;
    --s-dropped: #9b5f5a;
    --shadow: 0 10px 30px -14px rgba(20, 32, 28, .35);
    --sheet-shadow: 0 -8px 40px -10px rgba(20, 32, 28, .3);
    --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614;
      --surface: #18211e;
      --surface-2: #1d2724;
      --ink: #e8ede9;
      --muted: #9ba8a1;
      --faint: #76837c;
      --line: #27332f;
      --line-soft: #202a27;
      --accent: #6fbfa5;
      --accent-ink: #0c1512;
      --accent-soft: #1e332c;
      --s-plan: #85a5d6;
      --s-reading: #d9a05b;
      --s-done: #6fbfa5;
      --s-dropped: #c98f89;
      --shadow: 0 10px 30px -14px rgba(0, 0, 0, .6);
      --sheet-shadow: 0 -8px 40px -10px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614;
    --surface: #18211e;
    --surface-2: #1d2724;
    --ink: #e8ede9;
    --muted: #9ba8a1;
    --faint: #76837c;
    --line: #27332f;
    --line-soft: #202a27;
    --accent: #6fbfa5;
    --accent-ink: #0c1512;
    --accent-soft: #1e332c;
    --s-plan: #85a5d6;
    --s-reading: #d9a05b;
    --s-done: #6fbfa5;
    --s-dropped: #c98f89;
    --shadow: 0 10px 30px -14px rgba(0, 0, 0, .6);
    --sheet-shadow: 0 -8px 40px -10px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 660px;
    margin: 0 auto;
    padding-inline: 18px;
    padding-block: 22px calc(104px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .eyebrow {
    font-size: .66rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 2px;
  }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: 2.1rem;
    line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance;
  }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .ghost {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: .84rem; font-weight: 500; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost strong { font-weight: 700; color: var(--ink); }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { padding: 2px 12px; }
  .stat:first-child { padding-left: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat-v { font-family: var(--mono); font-weight: 500; font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat-v span { font-family: var(--sans); font-size: .78rem; color: var(--muted); font-weight: 400; }
  .stat-l {
    font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
    margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- filters ---------- */
  .bar { display: flex; flex-direction: column; gap: 10px; }
  .tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -18px; padding-inline: 18px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font-size: .86rem; font-weight: 500;
    color: var(--muted); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center;
  }
  .tab .n { font-family: var(--mono); font-size: .76rem; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab[aria-selected="true"] .n { color: var(--accent-ink); opacity: .75; }
  .search {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 15px; font-size: .92rem;
  }
  .search::placeholder { color: var(--faint); }
  .readers { display: flex; gap: 7px; flex-wrap: wrap; }
  .reader {
    background: transparent; border: 1px dashed var(--line); border-radius: 999px;
    padding: 5px 12px; font-size: .8rem; color: var(--muted);
  }
  .reader[aria-pressed="true"] { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---------- list ---------- */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .book {
    width: 100%; display: grid; grid-template-columns: 3px 1fr auto;
    gap: 0 14px; align-items: stretch; text-align: left;
    background: transparent; border: 0; border-top: 1px solid var(--line-soft);
    padding: 0; color: inherit;
  }
  .book:first-child { border-top: 0; }
  .book:hover { background: var(--surface-2); }
  .spine { border-radius: 0 3px 3px 0; background: var(--s-plan); }
  .book[data-s="reading"] .spine { background: var(--s-reading); }
  .book[data-s="done"] .spine { background: var(--s-done); }
  .book[data-s="dropped"] .spine { background: var(--s-dropped); opacity: .55; }
  .bk-main { padding: 13px 0 14px 0; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .bk-title {
    font-family: var(--serif); font-size: 1.08rem; font-weight: 600; line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .book[data-s="dropped"] .bk-title { color: var(--muted); }
  .bk-author { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .bk-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 5px; font-size: .76rem; color: var(--faint); }
  .bk-meta .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .prog { width: 74px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; flex: 0 0 auto; }
  .prog i { display: block; height: 100%; background: var(--s-reading); }
  .stars { letter-spacing: .06em; color: var(--s-done); font-size: .84rem; }
  .stars i { color: var(--line); font-style: normal; }
  .bk-side { padding: 14px 14px 14px 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 6px; }
  .who {
    font-size: .64rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: 999px; padding: 3px 8px; white-space: nowrap;
  }
  .chip-ex { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  .empty { padding: 34px 20px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 4px; font-family: var(--serif); font-size: 1.15rem; color: var(--ink); }
  .empty small { font-size: .84rem; }

  /* ---------- notices ---------- */
  .notice {
    border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
    padding: 11px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  #notices:empty, #hint-bottom:empty { display: none; }
  #notices { display: flex; flex-direction: column; gap: 10px; }
  .notice.merge { border-color: var(--accent); background: var(--accent-soft); }
  .notice p { margin: 0; font-size: .9rem; }
  .notice p b { font-weight: 700; }
  .notice-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint {
    display: flex; gap: 12px; align-items: baseline; justify-content: space-between;
    font-size: .82rem; color: var(--muted);
  }
  .hint button {
    background: none; border: 0; color: var(--faint); text-decoration: underline;
    font-size: .78rem; padding: 0; white-space: nowrap; flex: 0 0 auto;
  }

  /* ---------- buttons ---------- */
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
    border-radius: 999px; padding: 9px 16px; font-size: .88rem; font-weight: 500;
  }
  .btn.sec { background: transparent; color: var(--accent); }
  .btn.warn { background: transparent; color: var(--s-dropped); border-color: var(--s-dropped); }
  .fab {
    position: fixed; right: max(18px, calc(50% - 330px + 18px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 999px; padding: 14px 20px; font-size: .95rem; font-weight: 700;
    box-shadow: var(--shadow); z-index: 20;
  }

  /* ---------- sheet ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20, 32, 28, .45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--surface);
    border-radius: 20px 20px 0 0; box-shadow: var(--sheet-shadow);
    max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateY(14px); transition: transform .22s ease;
    display: flex; flex-direction: column; gap: 14px;
  }
  .overlay.open .sheet { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .sheet { transition: none; }
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet-head h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 0; }
  .x { background: none; border: 0; font-size: 1.5rem; line-height: 1; color: var(--faint); padding: 0 4px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .legend { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field textarea {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font-size: 1rem; width: 100%;
  }
  .field textarea { min-height: 72px; resize: vertical; font-size: .95rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .two > .field input { max-width: 100%; }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .seg button {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 8px; font-size: .86rem; font-weight: 500; color: var(--muted);
    display: flex; align-items: center; gap: 7px; justify-content: center;
  }
  .seg button::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; opacity: .5; }
  .seg button[aria-pressed="true"] { color: var(--ink); border-color: currentColor; background: transparent; }
  .seg button[data-v="plan"][aria-pressed="true"] { color: var(--s-plan); }
  .seg button[data-v="reading"][aria-pressed="true"] { color: var(--s-reading); }
  .seg button[data-v="done"][aria-pressed="true"] { color: var(--s-done); }
  .seg button[data-v="dropped"][aria-pressed="true"] { color: var(--s-dropped); }
  .seg button[aria-pressed="true"]::before { opacity: 1; }
  .rate { display: flex; gap: 4px; align-items: center; }
  .rate button { background: none; border: 0; font-size: 1.55rem; line-height: 1; padding: 2px; color: var(--line); }
  .rate button[data-on="1"] { color: var(--s-done); }
  .rate .clear { font-size: .78rem; color: var(--faint); text-decoration: underline; margin-left: 6px; }
  .err { color: var(--s-dropped); font-size: .8rem; }
  .sheet-foot { display: flex; gap: 10px; align-items: center; margin-top: 2px; }
  .sheet-foot .btn { flex: 1; padding: 13px; font-weight: 700; }
  .del { background: none; border: 1px solid var(--line); color: var(--s-dropped); border-radius: 999px; padding: 12px 15px; font-size: .88rem; }
  .sheet p.note { margin: 0; font-size: .82rem; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: .85rem; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .toast.show { opacity: 1; }
  footer { text-align: center; font-size: .74rem; color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Ortak okuma günlüğü</p>
      <h1>Kitaplık</h1>
    </div>
    <div class="top-actions">
      <button class="ghost" id="btn-share" type="button">Listeyi gönder</button>
      <button class="ghost" id="btn-settings" type="button" aria-label="Ayarlar ve isim">⚙<strong id="me-name">Ben</strong></button>
    </div>
  </header>

  <div id="notices"></div>

  <section class="stats" id="stats" aria-label="Özet"></section>

  <div class="bar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Durum filtresi"></div>
    <input class="search" id="q" type="search" placeholder="Kitap veya yazar ara" aria-label="Kitap veya yazar ara" />
    <div class="readers" id="readers"></div>
  </div>

  <section class="list" id="list" aria-label="Kitaplar"></section>

  <div id="hint-bottom"></div>

  <footer>Kayıtlar yalnızca bu telefonda saklanır · Listeyi göndererek eşleşirsiniz</footer>
</div>

<button class="fab" id="btn-add" type="button">+ Kitap</button>

<div class="overlay" id="ov-book" role="dialog" aria-modal="true" aria-labelledby="book-title">
  <form class="sheet" id="form-book" novalidate>
    <div class="sheet-head">
      <h2 id="book-title">Kitap ekle</h2>
      <button class="x" type="button" data-close aria-label="Kapat">×</button>
    </div>
    <div class="field">
      <label for="f-title">Kitap adı</label>
      <input id="f-title" type="text" autocomplete="off" enterkeyhint="done" />
      <div class="err" id="f-title-err" hidden>Kitap adı gerekli.</div>
    </div>
    <div class="field">
      <label for="f-author">Yazar</label>
      <input id="f-author" type="text" autocomplete="off" />
    </div>
    <div class="field">
      <span class="legend" id="lg-status">Durum</span>
      <div class="seg" id="f-status" role="group" aria-labelledby="lg-status">
        <button type="button" data-v="plan">Sırada</button>
        <button type="button" data-v="reading">Okuyorum</button>
        <button type="button" data-v="done">Bitirdim</button>
        <button type="button" data-v="dropped">Bıraktım</button>
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label for="f-pages">Sayfa sayısı</label>
        <input id="f-pages" type="number" min="0" max="20000" inputmode="numeric" />
      </div>
      <div class="field" id="wrap-current">
        <label for="f-current">Kaçıncı sayfada</label>
        <input id="f-current" type="number" min="0" max="20000" inputmode="numeric" />
      </div>
    </div>
    <div class="field" id="wrap-rate">
      <span class="legend" id="lg-rate">Puan</span>
      <div class="rate" id="f-rate" role="group" aria-labelledby="lg-rate">
        <button type="button" data-v="1" aria-label="1 yıldız">★</button>
        <button type="button" data-v="2" aria-label="2 yıldız">★</button>
        <button type="button" data-v="3" aria-label="3 yıldız">★</button>
        <button type="button" data-v="4" aria-label="4 yıldız">★</button>
        <button type="button" data-v="5" aria-label="5 yıldız">★</button>
        <button type="button" class="clear" id="f-rate-clear">temizle</button>
      </div>
    </div>
    <div class="two">
      <div class="field" id="wrap-start">
        <label for="f-start">Başlama</label>
        <input id="f-start" type="date" />
      </div>
      <div class="field" id="wrap-finish">
        <label for="f-finish">Bitirme</label>
        <input id="f-finish" type="date" />
      </div>
    </div>
    <div class="field">
      <label for="f-owner">Okuyan</label>
      <input id="f-owner" type="text" autocomplete="off" list="owners" />
      <datalist id="owners"></datalist>
    </div>
    <div class="field">
      <label for="f-note">Not</label>
      <textarea id="f-note" placeholder="Aklında kalan bir cümle, kime önereceğin…"></textarea>
    </div>
    <div class="sheet-foot">
      <button class="btn" type="submit">Kaydet</button>
      <button class="del" type="button" id="f-del" hidden>Sil</button>
    </div>
  </form>
</div>

<div class="overlay" id="ov-set" role="dialog" aria-modal="true" aria-labelledby="set-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="set-title">Ayarlar</h2>
      <button class="x" type="button" data-close aria-label="Kapat">×</button>
    </div>
    <div class="field">
      <label for="s-me">Adınız</label>
      <input id="s-me" type="text" autocomplete="off" placeholder="Ben" />
      <p class="note">Eklediğiniz kitaplar bu isimle işaretlenir; listeleri birleştirince kimin okuduğu karışmaz.</p>
    </div>
    <div class="field">
      <span class="legend">Liste</span>
      <div class="notice-row">
        <button class="btn sec" type="button" id="s-share">Listeyi gönder</button>
        <button class="btn warn" type="button" id="s-reset">Tüm kayıtları sil</button>
      </div>
      <p class="note" id="s-count"></p>
    </div>
    <div class="sheet-foot">
      <button class="btn" type="button" data-close>Tamam</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var KEY = "kitaplik.v1";
  var STATUS = {
    plan: { label: "Sırada", tab: "Sırada" },
    reading: { label: "Okuyorum", tab: "Okuyorum" },
    done: { label: "Bitirdim", tab: "Bitirdim" },
    dropped: { label: "Bıraktım", tab: "Bıraktım" }
  };
  var ORDER = ["reading", "plan", "done", "dropped"];

  var EXAMPLES = [
    { id: "ex-1", t: "Kürk Mantolu Madonna", a: "Sabahattin Ali", s: "done", p: 160, c: 160, r: 5, n: "", o: "Ben", sd: "", fd: iso(-26), u: 1, ex: 1 },
    { id: "ex-2", t: "Sapiens", a: "Yuval Noah Harari", s: "reading", p: 512, c: 188, r: 0, n: "", o: "Ben", sd: iso(-9), fd: "", u: 1, ex: 1 },
    { id: "ex-3", t: "Tutunamayanlar", a: "Oğuz Atay", s: "plan", p: 724, c: 0, r: 0, n: "Uzun, tatile saklıyorum.", o: "Ben", sd: "", fd: "", u: 1, ex: 1 }
  ];

  var state = load();
  var ui = { status: "all", owner: "all", q: "" };
  var editing = null;
  var draft = { s: "plan", r: 0 };
  var incoming = null;

  var el = {
    notices: byId("notices"), stats: byId("stats"), tabs: byId("tabs"),
    readers: byId("readers"), list: byId("list"), q: byId("q"),
    meName: byId("me-name"), owners: byId("owners"), toast: byId("toast"),
    hintBottom: byId("hint-bottom")
  };

  /* ---------- storage ---------- */

  function byId(id) { return document.getElementById(id); }

  function iso(offsetDays) {
    var d = new Date();
    d.setDate(d.getDate() + (offsetDays || 0));
    return d.toISOString().slice(0, 10);
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.books)) {
          return { me: s.me || "Ben", books: s.books, hints: s.hints || {} };
        }
      } catch (e) { /* bozuk kayıt: sıfırdan başla */ }
    }
    return { me: "Ben", books: EXAMPLES.slice(), hints: {} };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {
      toast("Kayıt yapılamadı — tarayıcı depolaması kapalı olabilir.");
    }
  }

  /* ---------- helpers ---------- */

  function uid() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  }

  function num(v) {
    var n = parseInt(v, 10);
    return isNaN(n) || n < 0 ? 0 : Math.min(n, 20000);
  }

  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("tr-TR", { day: "numeric", month: "short", year: "numeric" });
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove("show"); }, 2600);
  }

  function owners() {
    var seen = [];
    state.books.forEach(function (b) {
      var o = (b.o || "").trim();
      if (o && seen.indexOf(o) === -1) seen.push(o);
    });
    return seen;
  }

  function visible() {
    var q = ui.q.trim().toLocaleLowerCase("tr");
    return state.books.filter(function (b) {
      if (ui.status !== "all" && b.s !== ui.status) return false;
      if (ui.owner !== "all" && (b.o || "") !== ui.owner) return false;
      if (q) {
        var hay = ((b.t || "") + " " + (b.a || "")).toLocaleLowerCase("tr");
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (x, y) {
      var d = ORDER.indexOf(x.s) - ORDER.indexOf(y.s);
      if (d !== 0) return d;
      if (x.s === "done") return (y.fd || "").localeCompare(x.fd || "");
      return (x.t || "").localeCompare(y.t || "", "tr");
    });
  }

  /* ---------- render ---------- */

  function render() {
    el.meName.textContent = state.me;
    renderNotices();
    renderStats();
    renderTabs();
    renderReaders();
    renderList();
    el.owners.innerHTML = "";
    owners().forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o;
      el.owners.appendChild(opt);
    });
  }

  function renderStats() {
    var pool = state.books.filter(function (b) {
      return ui.owner === "all" || (b.o || "") === ui.owner;
    });
    var done = pool.filter(function (b) { return b.s === "done"; });
    var pages = 0;
    pool.forEach(function (b) {
      if (b.s === "done") pages += num(b.p);
      else if (b.s === "reading" || b.s === "dropped") pages += Math.min(num(b.c), num(b.p) || num(b.c));
    });
    var rated = done.filter(function (b) { return b.r > 0; });
    var avg = rated.length
      ? (rated.reduce(function (a, b) { return a + b.r; }, 0) / rated.length).toFixed(1)
      : "—";
    el.stats.innerHTML =
      cell(String(done.length), "bitirilen kitap") +
      cell(pages > 999 ? (pages / 1000).toFixed(1) + "<span> bin</span>" : String(pages), "okunan sayfa") +
      cell(avg === "—" ? "—" : avg + "<span> / 5</span>", "ortalama puan");
  }

  function cell(value, label) {
    return '<div class="stat"><div class="stat-v">' + value +
      '</div><div class="stat-l">' + label + "</div></div>";
  }

  function renderTabs() {
    var counts = { all: state.books.length };
    Object.keys(STATUS).forEach(function (k) { counts[k] = 0; });
    state.books.forEach(function (b) { if (counts[b.s] != null) counts[b.s]++; });

    var keys = ["all"].concat(ORDER);
    el.tabs.innerHTML = keys.map(function (k) {
      var label = k === "all" ? "Tümü" : STATUS[k].tab;
      return '<button class="tab" type="button" role="tab" data-k="' + k + '" aria-selected="' +
        (ui.status === k) + '">' + label + '<span class="n">' + counts[k] + "</span></button>";
    }).join("");
  }

  function renderReaders() {
    var list = owners();
    if (list.length < 2) { el.readers.innerHTML = ""; return; }
    el.readers.innerHTML = ['<button class="reader" type="button" data-o="all" aria-pressed="' +
      (ui.owner === "all") + '">Hepsi</button>'].concat(list.map(function (o) {
      return '<button class="reader" type="button" data-o="' + esc(o) + '" aria-pressed="' +
        (ui.owner === o) + '">' + esc(o) + "</button>";
    })).join("");
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderList() {
    var books = visible();
    if (!books.length) {
      el.list.innerHTML = '<div class="empty"><p>' +
        (state.books.length ? "Bu filtrede kitap yok." : "Kitaplık henüz boş.") +
        '</p><small>' +
        (state.books.length ? "Başka bir sekmeye bak ya da aramayı temizle." : "Sağ alttaki + Kitap ile ilk kaydı ekle.") +
        "</small></div>";
      return;
    }
    el.list.innerHTML = books.map(row).join("");
  }

  function row(b) {
    var meta = [];
    if (b.s === "reading") {
      var p = num(b.p), c = num(b.c);
      var pct = p > 0 ? Math.max(0, Math.min(100, Math.round((c / p) * 100))) : 0;
      if (p > 0) {
        meta.push('<span class="prog"><i style="width:' + pct + '%"></i></span>');
        meta.push('<span class="mono">' + c + " / " + p + " s.</span>");
        meta.push("<span>%" + pct + "</span>");
      } else if (c > 0) {
        meta.push('<span class="mono">' + c + ". sayfa</span>");
      } else {
        meta.push("<span>Okunuyor</span>");
      }
    } else if (b.s === "done") {
      if (b.r > 0) meta.push('<span class="stars">' + stars(b.r) + "</span>");
      if (b.fd) meta.push('<span class="mono">' + fmtDate(b.fd) + "</span>");
      if (!b.r && !b.fd) meta.push("<span>Bitirildi</span>");
    } else if (b.s === "plan") {
      meta.push("<span>Sırada</span>");
      if (num(b.p)) meta.push('<span class="mono">' + num(b.p) + " s.</span>");
    } else {
      meta.push("<span>Bırakıldı</span>");
      if (num(b.c)) meta.push('<span class="mono">' + num(b.c) + ". sayfada</span>");
    }
    if (b.n) meta.push("<span>· not var</span>");

    return '<button class="book" type="button" data-id="' + esc(b.id) + '" data-s="' + esc(b.s) + '">' +
      '<span class="spine" aria-hidden="true"></span>' +
      '<span class="bk-main">' +
        '<span class="bk-title">' + esc(b.t || "Adsız kitap") + "</span>" +
        (b.a ? '<span class="bk-author">' + esc(b.a) + "</span>" : "") +
        '<span class="bk-meta">' + meta.join("") + "</span>" +
      "</span>" +
      '<span class="bk-side">' +
        (b.o ? '<span class="who">' + esc(b.o) + "</span>" : "<span></span>") +
        (b.ex ? '<span class="chip-ex">örnek</span>' : "") +
      "</span></button>";
  }

  function stars(n) {
    var out = "";
    for (var i = 1; i <= 5; i++) out += i <= n ? "★" : "<i>★</i>";
    return out;
  }

  function renderNotices() {
    var html = "";
    if (incoming) {
      html += '<div class="notice merge"><p><b>' + esc(incoming.from || "Bir liste") +
        "</b> " + incoming.books.length + " kitap gönderdi. Kendi listenize eklenmesini ister misiniz?" +
        '</p><div class="notice-row"><button class="btn" type="button" id="n-merge">Listeye ekle</button>' +
        '<button class="btn sec" type="button" id="n-skip">Şimdi değil</button></div></div>';
    }
    if (state.books.some(function (b) { return b.ex; })) {
      html += '<div class="notice"><div class="hint"><span>Başlarken görünen üç kayıt örnektir.</span>' +
        '<button type="button" id="n-clearex">örnekleri sil</button></div></div>';
    }
    el.notices.innerHTML = html;

    el.hintBottom.innerHTML = (!state.hints.a2hs && !isStandalone())
      ? '<div class="notice"><div class="hint"><span>Uygulama gibi kullanmak için: Safari\'de <b>Paylaş</b> → <b>Ana Ekrana Ekle</b>.</span>' +
        '<button type="button" id="n-hide">gizle</button></div></div>'
      : "";
  }

  function isStandalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  /* ---------- sheets ---------- */

  function openSheet(id) {
    byId(id).classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeSheets() {
    byId("ov-book").classList.remove("open");
    byId("ov-set").classList.remove("open");
    document.body.style.overflow = "";
  }

  function setStatus(v) {
    draft.s = v;
    Array.prototype.forEach.call(byId("f-status").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.v === v));
    });
    byId("wrap-current").hidden = (v === "plan" || v === "done");
    byId("wrap-rate").hidden = (v === "plan");
    byId("wrap-start").hidden = (v === "plan");
    byId("wrap-finish").hidden = (v !== "done");
  }

  function setRate(n) {
    draft.r = n;
    Array.prototype.forEach.call(byId("f-rate").children, function (b) {
      if (!b.dataset.v) return;
      b.dataset.on = Number(b.dataset.v) <= n ? "1" : "0";
    });
  }

  function openBook(id) {
    editing = id || null;
    var b = id ? state.books.filter(function (x) { return x.id === id; })[0] : null;
    byId("book-title").textContent = b ? "Kitabı düzenle" : "Kitap ekle";
    byId("f-title").value = b ? (b.t || "") : "";
    byId("f-author").value = b ? (b.a || "") : "";
    byId("f-pages").value = b && num(b.p) ? num(b.p) : "";
    byId("f-current").value = b && num(b.c) ? num(b.c) : "";
    byId("f-start").value = b ? (b.sd || "") : "";
    byId("f-finish").value = b ? (b.fd || "") : "";
    byId("f-owner").value = b ? (b.o || state.me) : state.me;
    byId("f-note").value = b ? (b.n || "") : "";
    byId("f-title-err").hidden = true;
    byId("f-del").hidden = !b;
    setStatus(b ? b.s : (ui.status !== "all" ? ui.status : "plan"));
    setRate(b ? (b.r || 0) : 0);
    openSheet("ov-book");
    setTimeout(function () { if (!b) byId("f-title").focus(); }, 60);
  }

  byId("form-book").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = byId("f-title").value.trim();
    if (!title) {
      byId("f-title-err").hidden = false;
      byId("f-title").focus();
      return;
    }
    var b = editing ? state.books.filter(function (x) { return x.id === editing; })[0] : null;
    var isNew = !b;
    if (isNew) { b = { id: uid() }; state.books.push(b); }

    var prevStatus = b.s;
    b.t = title;
    b.a = byId("f-author").value.trim();
    b.s = draft.s;
    b.p = num(byId("f-pages").value);
    b.c = draft.s === "done" ? b.p : num(byId("f-current").value);
    b.r = draft.s === "plan" ? 0 : draft.r;
    b.n = byId("f-note").value.trim();
    b.o = byId("f-owner").value.trim() || state.me;
    b.sd = byId("f-start").value || "";
    b.fd = draft.s === "done" ? (byId("f-finish").value || b.fd || iso(0)) : "";
    if ((b.s === "reading" || b.s === "done") && !b.sd && prevStatus !== b.s) b.sd = iso(0);
    b.u = Date.now();
    delete b.ex;

    save();
    closeSheets();
    render();
    toast(isNew ? "“" + title + "” eklendi." : "Kaydedildi.");
  });

  byId("f-del").addEventListener("click", function () {
    if (!editing) return;
    var b = state.books.filter(function (x) { return x.id === editing; })[0];
    if (!b) return;
    if (!confirm("“" + (b.t || "Bu kitap") + "” silinsin mi?")) return;
    state.books = state.books.filter(function (x) { return x.id !== editing; });
    save();
    closeSheets();
    render();
    toast("Silindi.");
  });

  byId("f-status").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-v]");
    if (btn) setStatus(btn.dataset.v);
  });

  byId("f-rate").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-v]");
    if (btn) setRate(Number(btn.dataset.v));
  });

  byId("f-rate-clear").addEventListener("click", function () { setRate(0); });

  /* ---------- share & merge ---------- */

  function encode(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function decode(str) {
    var b64 = str.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function shareLink() {
    var books = state.books.filter(function (b) { return !b.ex; });
    if (!books.length) { toast("Gönderilecek kayıt yok."); return; }
    var url = location.origin + location.pathname + "#p=" +
      encode({ v: 1, from: state.me, books: books });
    if (url.length > 60000) { toast("Liste bağlantı için çok uzun."); return; }

    if (navigator.share) {
      navigator.share({ title: "Kitaplık", text: state.me + " kitap listesini paylaştı", url: url })
        .catch(function () { copy(url); });
    } else {
      copy(url);
    }
  }

  function copy(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        toast("Bağlantı kopyalandı — mesajla gönderebilirsiniz.");
      }).catch(function () { fallbackCopy(url); });
    } else {
      fallbackCopy(url);
    }
  }

  function fallbackCopy(url) {
    var ta = document.createElement("textarea");
    ta.value = url;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Bağlantı kopyalandı." : "Bağlantıyı kopyalayamadım; adres çubuğundan alabilirsiniz.");
    if (!ok) location.hash = "p=" + encode({ v: 1, from: state.me, books: state.books.filter(function (b) { return !b.ex; }) });
  }

  function readHash() {
    var m = /[#&]p=([A-Za-z0-9\-_]+)/.exec(location.hash || "");
    if (!m) return;
    try {
      var data = decode(m[1]);
      if (data && Array.isArray(data.books) && data.books.length) {
        incoming = { from: data.from, books: data.books };
      }
    } catch (e) {
      toast("Gelen bağlantı okunamadı.");
    }
    history.replaceState(null, "", location.pathname + location.search);
  }

  function merge() {
    if (!incoming) return;
    var added = 0, updated = 0;
    incoming.books.forEach(function (inc) {
      if (!inc || !inc.id || !inc.t) return;
      var mine = state.books.filter(function (b) { return b.id === inc.id; })[0];
      if (!mine) {
        state.books.push({
          id: String(inc.id), t: String(inc.t), a: inc.a ? String(inc.a) : "",
          s: STATUS[inc.s] ? inc.s : "plan", p: num(inc.p), c: num(inc.c),
          r: Math.max(0, Math.min(5, num(inc.r))), n: inc.n ? String(inc.n) : "",
          o: inc.o ? String(inc.o) : (incoming.from || "Eşim"),
          sd: inc.sd || "", fd: inc.fd || "", u: num(inc.u) || Date.now()
        });
        added++;
      } else if ((inc.u || 0) > (mine.u || 0)) {
        mine.t = String(inc.t); mine.a = inc.a ? String(inc.a) : "";
        mine.s = STATUS[inc.s] ? inc.s : mine.s;
        mine.p = num(inc.p); mine.c = num(inc.c);
        mine.r = Math.max(0, Math.min(5, num(inc.r)));
        mine.n = inc.n ? String(inc.n) : "";
        mine.o = inc.o ? String(inc.o) : mine.o;
        mine.sd = inc.sd || ""; mine.fd = inc.fd || "";
        mine.u = num(inc.u);
        delete mine.ex;
        updated++;
      }
    });
    incoming = null;
    save();
    render();
    toast(added + " kitap eklendi" + (updated ? ", " + updated + " güncellendi" : "") + ".");
  }

  /* ---------- events ---------- */

  el.tabs.addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (!b) return;
    ui.status = b.dataset.k;
    renderTabs();
    renderList();
  });

  el.readers.addEventListener("click", function (e) {
    var b = e.target.closest(".reader");
    if (!b) return;
    ui.owner = b.dataset.o;
    renderReaders();
    renderStats();
    renderList();
  });

  el.list.addEventListener("click", function (e) {
    var b = e.target.closest(".book");
    if (b) openBook(b.dataset.id);
  });

  el.q.addEventListener("input", function () {
    ui.q = el.q.value;
    renderList();
  });

  function onNoticeClick(e) {
    var t = e.target;
    if (t.id === "n-merge") merge();
    else if (t.id === "n-skip") { incoming = null; renderNotices(); }
    else if (t.id === "n-clearex") {
      state.books = state.books.filter(function (b) { return !b.ex; });
      save(); render(); toast("Örnekler silindi.");
    } else if (t.id === "n-hide") {
      state.hints.a2hs = 1; save(); renderNotices();
    }
  }

  el.notices.addEventListener("click", onNoticeClick);
  el.hintBottom.addEventListener("click", onNoticeClick);

  byId("btn-add").addEventListener("click", function () { openBook(null); });
  byId("btn-share").addEventListener("click", shareLink);
  byId("s-share").addEventListener("click", shareLink);

  byId("btn-settings").addEventListener("click", function () {
    byId("s-me").value = state.me;
    var real = state.books.filter(function (b) { return !b.ex; }).length;
    byId("s-count").textContent = real + " kayıt bu telefonda saklanıyor.";
    openSheet("ov-set");
  });

  byId("s-me").addEventListener("change", function () {
    var v = byId("s-me").value.trim();
    state.me = v || "Ben";
    save();
    el.meName.textContent = state.me;
  });

  byId("s-reset").addEventListener("click", function () {
    if (!confirm("Bütün kitaplar bu telefondan silinsin mi? Geri alınamaz.")) return;
    state.books = [];
    save();
    closeSheets();
    render();
    toast("Kitaplık boşaltıldı.");
  });

  document.addEventListener("click", function (e) {
    if (e.target.matches("[data-close]")) closeSheets();
    if (e.target.classList.contains("overlay")) closeSheets();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheets();
  });

  readHash();
  render();

  if (document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* çevrimdışı desteği yok */ });
    });
  }
})();
</script>
